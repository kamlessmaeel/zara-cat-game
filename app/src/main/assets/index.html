<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Зара Cat game</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#7ec8ff;touch-action:manipulation}.game{position:relative;width:100%;height:100%;overflow:hidden;background:url(city_bg.jpg) center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(rgba(50,150,230,.08),rgba(10,20,40,.10))}.title{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-weight:900;font-size:34px;color:#fff;text-shadow:0 3px 0 #7a3b68,0 5px 10px #0008;white-space:nowrap;z-index:9}.hud{position:absolute;top:66px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:9}.pill{background:#fff4dc;border:3px solid #8a5b2b;border-radius:16px;padding:8px 14px;font-weight:800;color:#4c2b13;box-shadow:0 3px 0 #6e451f}.ground{position:absolute;left:0;right:0;bottom:0;height:7%;background:linear-gradient(#d6b17f,#b78352);border-top:4px solid #7c5533}.cat{position:absolute;left:50%;width:118px;transform:translateX(-50%);z-index:7;filter:drop-shadow(0 5px 3px #0004)}.cat img{width:100%;height:auto;display:block}.cookie{position:absolute;width:110px;height:auto;z-index:6;filter:drop-shadow(0 4px 3px #0005)}.cookie img{width:100%;display:block}.msg{position:absolute;left:8%;right:8%;top:42%;z-index:20;background:#fff1d0;border:4px solid #8b5a2c;border-radius:22px;padding:20px;text-align:center;font-weight:900;font-size:24px;color:#533016;box-shadow:0 8px 0 #6b431f}.msg button{margin-top:14px;border:3px solid #375b12;border-radius:16px;background:#78c729;color:#fff;padding:12px 24px;font-size:21px;font-weight:900}.hint{position:absolute;left:5%;right:5%;bottom:2.5%;z-index:10;background:#fff2d5dd;border:3px solid #8a5a2d;border-radius:18px;padding:10px;text-align:center;font-size:18px;font-weight:800;color:#4b2d18}.hidden{display:none}.spark{position:absolute;z-index:15;font-size:28px;animation:pop .65s ease-out forwards}@keyframes pop{from{transform:scale(.5);opacity:1}to{transform:translateY(-55px) scale(1.3);opacity:0}}
</style></head><body><div id="game" class="game"><div class="shade"></div><div class="title">Зара Cat game</div><div class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🏆 <span id="best">0</span></div></div><div id="cat" class="cat"><img id="catImg" src="cat_open.png"></div><div class="ground"></div><div id="message" class="msg"><div>Строй башню из печенья 🍪</div><div style="font-size:17px;margin-top:8px">Прыгай вовремя, пока печенье едет справа или слева.</div><button id="start">Играть</button></div><div class="hint">Нажмите на экран, чтобы прыгнуть</div></div><script>
(()=>{const game=document.getElementById('game'),cat=document.getElementById('cat'),catImg=document.getElementById('catImg'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('message'),start=document.getElementById('start');let running=false,score=0,best=0,vy=0,jy=0,jumping=false,last=0,nextSpawn=0,moving=null,stack=[];const CH=48,CW=110,GROUND=.07;function baseY(){return game.clientHeight*GROUND+stack.length*CH+8}function placeCat(){cat.style.bottom=(baseY()+jy)+'px'}function reset(){stack.forEach(x=>x.remove());stack=[];if(moving){moving.el.remove();moving=null}score=0;scoreEl.textContent=0;jy=0;vy=0;jumping=false;catImg.src='cat_open.png';running=true;msg.classList.add('hidden');last=performance.now();nextSpawn=last+700;placeCat();requestAnimationFrame(loop)}function jump(){if(!running||jumping)return;jumping=true;vy=15.8;catImg.src='cat_closed.png'}function spawn(){if(moving)return;let left=Math.random()<.5;let el=document.createElement('div');el.className='cookie';el.innerHTML='<img src="cookie.png">';game.appendChild(el);let y=game.clientHeight*GROUND+stack.length*CH;el.style.bottom=y+'px';let x=left?-CW-10:game.clientWidth+10;el.style.left=x+'px';moving={el,x,dir:left?1:-1,speed:5+Math.min(score*.12,4),target:game.clientWidth/2-CW/2}}function fail(){running=false;best=Math.max(best,score);bestEl.textContent=best;catImg.src='cat_open.png';msg.innerHTML='<div>Игра окончена!</div><div style="font-size:18px;margin-top:8px">Высота башни: '+score+'</div><button id="again">Играть снова</button>';msg.classList.remove('hidden');document.getElementById('again').addEventListener('click',reset)}function settle(){let el=moving.el;el.style.left=(game.clientWidth/2-CW/2)+'px';el.style.bottom=(game.clientHeight*GROUND+stack.length*CH)+'px';stack.push(el);moving=null;score++;scoreEl.textContent=score;let s=document.createElement('div');s.className='spark';s.textContent='⭐';s.style.left='50%';s.style.bottom=(baseY()+80)+'px';game.appendChild(s);setTimeout(()=>s.remove(),700);nextSpawn=performance.now()+500;placeCat()}function loop(t){if(!running)return;let dt=Math.min((t-last)/16.67,2);last=t;if(t>nextSpawn&&!moving)spawn();if(jumping){jy+=vy*dt;vy-=.9*dt;if(jy<=0){jy=0;vy=0;jumping=false;catImg.src='cat_open.png'}placeCat()}if(moving){moving.x+=moving.dir*moving.speed*dt;moving.el.style.left=moving.x+'px';let dist=Math.abs(moving.x-moving.target);let cr=cat.getBoundingClientRect(),rr=moving.el.getBoundingClientRect();let hit=!(cr.right<rr.left+18||cr.left>rr.right-18||cr.bottom<rr.top+8||cr.top>rr.bottom-8);if(hit && jy<CH+20){fail();return}if(dist<6){if(jy>CH+18)settle();else{fail();return}}}requestAnimationFrame(loop)}start.addEventListener('click',reset);game.addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON')jump()});window.addEventListener('resize',placeCat)})();
</script></body></html>
